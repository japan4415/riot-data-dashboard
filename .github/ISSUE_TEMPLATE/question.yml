name: 質問、その他
description: 使い方や、開発の進め方について聞きたいときに使います
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **実物の開示データと、そこから写した値を貼らないでください。** この Issue は誰でも読めます。
  - type: textarea
    id: question
    attributes:
      label: 内容
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 実物の開示データと、そこから写した値（ID、メールアドレス、IP アドレス、本文など）を含めていません
          required: true
